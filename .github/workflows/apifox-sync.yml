# 代码推送到 main 后，自动把最新接口文档同步到 Apifox。
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 里配置：
#   APIFOX_ACCESS_TOKEN  Apifox「账号设置 → API 访问令牌」生成的令牌
#   APIFOX_PROJECT_ID    Apifox「项目设置 → 基本设置」里的项目 ID
# 没配置时这一步会跳过，不会报错。
name: Sync API docs to Apifox

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check API docs are complete
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci_placeholder
        run: uv run python -m scripts.check_api_docs

      - name: Export OpenAPI
        env:
          # 导出文档只读代码，不连数据库；这里给一个占位地址让配置能加载
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci_placeholder
        run: uv run python -m scripts.export_openapi openapi.json

      - name: Import into Apifox
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
          APIFOX_PROJECT_ID: ${{ secrets.APIFOX_PROJECT_ID }}
        run: |
          if [ -z "$APIFOX_ACCESS_TOKEN" ] || [ -z "$APIFOX_PROJECT_ID" ]; then
            echo "未配置 Apifox 密钥，跳过同步"
            exit 0
          fi
          jq -n --rawfile spec openapi.json \
            '{input: $spec, options: {endpointOverwriteBehavior: "AUTO_MERGE", schemaOverwriteBehavior: "AUTO_MERGE"}}' > body.json
          curl --fail-with-body -sS -X POST \
            "https://api.apifox.com/v1/projects/${APIFOX_PROJECT_ID}/import-openapi?locale=zh-CN" \
            -H "X-Apifox-Api-Version: 2024-03-28" \
            -H "Authorization: Bearer ${APIFOX_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @body.json
