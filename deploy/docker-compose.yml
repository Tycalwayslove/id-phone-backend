# 单机部署，操作步骤见 docs/deploy.md。
x-backend: &backend
  image: idphone-backend
  build:
    context: ../backend
    dockerfile: Dockerfile
  pull_policy: build
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  env_file:
    - path: ./.env
      required: false
  environment: &backend-env
    APP_ENV: prod
    DB_ECHO: "false"
    DATABASE_URL: postgresql+psycopg://idphone_app:${POSTGRES_PASSWORD}@db:5432/idphone_prod
    PUBLIC_BASE_URL: https://${NGINX_SERVER_NAME:-idphone.example.com}
    SECRET_KEY: ${SECRET_KEY:?请在 deploy/.env 里设置 SECRET_KEY}
  volumes:
    - storage:/app/storage
    - type: bind
      source: ${WXPAY_CERT_DIR:-/etc/idphone/wxpay}
      target: /run/wxpay
      read_only: true
      bind:
        create_host_path: false
  networks: [data]

x-logging: &logging
  driver: local

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: idphone_prod
      POSTGRES_USER: idphone_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 里设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "idphone_app", "-d", "idphone_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
    logging: *logging

  api:
    <<: *backend
    # 只有容器网络可访问 API，nginx 会覆盖转发头。
    environment:
      <<: *backend-env
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [edge, data]
    logging: *logging

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.runner"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/proc/1/cmdline').read_bytes().split(b'\\0')[1:3] == [b'-m', b'app.workers.runner']"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  nginx:
    image: idphone-nginx
    build:
      context: ..
      dockerfile: deploy/admin-web.Dockerfile
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NGINX_ENVSUBST_FILTER: ^NGINX_(SERVER_NAME|TLS_CERT_FILE|TLS_KEY_FILE)
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-idphone.example.com}
      NGINX_TLS_CERT_FILE: ${NGINX_TLS_CERT_FILE:-/etc/nginx/tls/fullchain.pem}
      NGINX_TLS_KEY_FILE: ${NGINX_TLS_KEY_FILE:-/etc/nginx/tls/privkey.pem}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ${NGINX_TLS_DIR:-/etc/idphone/tls}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ACME_WEBROOT:-/var/www/idphone-acme}
        target: /var/www/acme
        read_only: true
        bind:
          create_host_path: false
    networks: [edge]
    logging: *logging

  backup:
    image: postgres:18
    init: true
    restart: unless-stopped
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    working_dir: /tmp
    command: ["bash", "/scripts/run-daily.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: idphone_prod
      PGUSER: idphone_app
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGCONNECT_TIMEOUT: 10
      BACKUP_OSS_URI: ${BACKUP_OSS_URI:-}
      HOME: /tmp
    volumes:
      - ./backup:/scripts:ro
      - type: bind
        source: ./backups
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKUP_OSS_DIR:-./backup}
        target: /run/backup-oss
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -type f -name 'idphone_prod-????-??-??.dump' -size +0c -mmin -1560 -print -quit | grep -q ."]
      start_period: 10m
      interval: 1m
      timeout: 5s
      retries: 3
    networks: [data]
    logging: *logging

networks:
  edge:
  data:

volumes:
  pgdata:
  storage:
