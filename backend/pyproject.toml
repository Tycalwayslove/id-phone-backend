[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=11.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 110
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# 中文全角标点在字符串和注释里是正常的
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的依赖注入写法
"app/**/router.py" = ["B008"]
"app/core/deps.py" = ["B008"]
"alembic/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
